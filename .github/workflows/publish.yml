name: Publish mobile SDKs

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      release_ref:
        description: Existing tag or commit to publish
        required: true
        default: 0.2.0
      version:
        description: Exact package version at release_ref
        required: true
        default: 0.2.0
      publish_flutter:
        description: Publish Flutter (first pub.dev release must be manual)
        required: true
        type: boolean
        default: false

concurrency:
  group: mobile-sdk-publication
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_ref: ${{ steps.release.outputs.release_ref }}
      version: ${{ steps.release.outputs.version }}
      publish_flutter: ${{ steps.release.outputs.publish_flutter }}
    steps:
      - id: release
        name: Resolve immutable release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG_NAME: ${{ github.ref_name }}
          INPUT_REF: ${{ inputs.release_ref }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PUBLISH_FLUTTER: ${{ inputs.publish_flutter }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "push" ]]; then
            version="$TAG_NAME"
            release_ref="$TAG_NAME"
            publish_flutter="true"
          else
            version="$INPUT_VERSION"
            release_ref="$INPUT_REF"
            publish_flutter="$INPUT_PUBLISH_FLUTTER"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid semantic version: $version" >&2
            exit 1
          fi
          echo "release_ref=$release_ref" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish_flutter=$publish_flutter" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.release_ref }}
          fetch-depth: 0

      - name: Validate every package version and identity
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          npm run check:versions -- --expected "$VERSION"
          git ls-remote --exit-code origin "refs/tags/$VERSION"
          tag_commit="$(git rev-parse "refs/tags/$VERSION^{commit}")"
          checkout_commit="$(git rev-parse HEAD)"
          if [[ "$checkout_commit" != "$tag_commit" ]]; then
            echo "release_ref must resolve to the commit tagged $VERSION" >&2
            exit 1
          fi

  publish-ios:
    needs: preflight
    runs-on: macos-15
    environment: sdk-release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.release_ref }}

      - id: existing
        name: Check CocoaPods version
        shell: bash
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          if pod trunk info OnloSDK 2>/dev/null | grep -Eq "^[[:space:]]+- ${VERSION} \\("; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish OnloSDK to CocoaPods
        if: steps.existing.outputs.published != 'true'
        env:
          COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}
        run: pod trunk push OnloSDK.podspec --allow-warnings

  publish-android:
    needs: preflight
    runs-on: ubuntu-latest
    environment: sdk-release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.release_ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android publication toolchain
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - id: existing
        name: Check Maven Central version
        shell: bash
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          url="https://repo1.maven.org/maven2/ai/onlo/onlo-android-sdk/${VERSION}/onlo-android-sdk-${VERSION}.pom"
          if curl --fail --silent --show-error --location "$url" >/dev/null; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish Android SDK to Maven Central
        if: steps.existing.outputs.published != 'true'
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.MAVEN_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MAVEN_SIGNING_PASSWORD }}
        run: |
          packages/android/gradlew -p packages/android \
            publishAndReleaseToMavenCentral \
            -Ponlo.maven.central=true \
            -Ponlo.release.version=${{ needs.preflight.outputs.version }}

  verify-ios:
    needs: [preflight, publish-ios]
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - name: Verify public SwiftPM tag
        shell: bash
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          git ls-remote --exit-code \
            https://github.com/onlo-ai/onlo-mobile-sdks.git \
            "refs/tags/$VERSION"

      - name: Verify public CocoaPods version
        shell: bash
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          for attempt in {1..20}; do
            if pod trunk info OnloSDK 2>/dev/null | grep -Eq "^[[:space:]]+- ${VERSION} \\("; then
              exit 0
            fi
            sleep 15
          done
          echo "OnloSDK $VERSION is not publicly resolvable" >&2
          exit 1

  verify-android:
    needs: [preflight, publish-android]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Verify public Maven version
        shell: bash
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          url="https://repo1.maven.org/maven2/ai/onlo/onlo-android-sdk/${VERSION}/onlo-android-sdk-${VERSION}.pom"
          for attempt in {1..120}; do
            if curl --fail --silent --show-error --location "$url" >/dev/null; then
              exit 0
            fi
            sleep 15
          done
          echo "Android SDK $VERSION is not publicly resolvable" >&2
          exit 1

  publish-react-native:
    needs: [preflight, verify-ios, verify-android]
    runs-on: ubuntu-latest
    environment: sdk-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.release_ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
          cache: npm

      - id: existing
        name: Check npm version
        shell: bash
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          if npm view "@onlo-ai/react-native@$VERSION" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish React Native package
        if: steps.existing.outputs.published != 'true'
        working-directory: packages/react-native
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance

  publish-flutter:
    needs: [preflight, verify-ios, verify-android]
    if: needs.preflight.outputs.publish_flutter == 'true'
    runs-on: ubuntu-latest
    environment: sdk-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.release_ref }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.2"
          cache: true

      - id: existing
        name: Check pub.dev version
        shell: bash
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          if curl --fail --silent --show-error --location \
            "https://pub.dev/api/packages/onlo_flutter" |
            grep -Fq "\"version\":\"$VERSION\""; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish Flutter package
        if: steps.existing.outputs.published != 'true'
        working-directory: packages/flutter
        run: flutter pub publish --force

  verify-wrappers:
    needs: [preflight, publish-react-native, publish-flutter]
    if: always() && needs.publish-react-native.result == 'success' && (needs.publish-flutter.result == 'success' || needs.publish-flutter.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Verify public npm version
        shell: bash
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          for attempt in {1..20}; do
            if [[ "$(npm view "@onlo-ai/react-native@$VERSION" version 2>/dev/null)" == "$VERSION" ]]; then
              exit 0
            fi
            sleep 15
          done
          echo "React Native SDK $VERSION is not publicly resolvable" >&2
          exit 1

      - name: Verify public pub.dev version when requested
        if: needs.preflight.outputs.publish_flutter == 'true'
        shell: bash
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          for attempt in {1..40}; do
            if curl --fail --silent --show-error --location \
              "https://pub.dev/api/packages/onlo_flutter" |
              grep -Fq "\"version\":\"$VERSION\""; then
              exit 0
            fi
            sleep 15
          done
          echo "Flutter SDK $VERSION is not publicly resolvable" >&2
          exit 1

  github-release:
    needs: [preflight, verify-wrappers]
    if: github.event_name == 'push' && needs.verify-wrappers.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.release_ref }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.preflight.outputs.release_ref }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          notes_file="$RUNNER_TEMP/release-notes.md"
          awk -v heading="## $VERSION" '
            $0 == heading { found = 1; next }
            found && /^## / { exit }
            found { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > "$notes_file"
          test -s "$notes_file"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Onlo Mobile SDKs $VERSION" \
              --notes-file "$notes_file"
