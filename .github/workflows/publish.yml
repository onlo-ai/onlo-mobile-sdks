name: Publish mobile SDKs

on:
  push:
    tags:
      - "sdk-v*"
  workflow_dispatch:
    inputs:
      release_ref:
        description: Existing tag or commit to publish
        required: true
        default: react-native-v0.1.0
      version:
        description: Exact package version at release_ref
        required: true
        default: 0.1.0
      publish_flutter:
        description: Publish Flutter (first pub.dev release must be manual)
        required: true
        type: boolean
        default: false

concurrency:
  group: mobile-sdk-publication
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_ref: ${{ steps.release.outputs.release_ref }}
      version: ${{ steps.release.outputs.version }}
      publish_flutter: ${{ steps.release.outputs.publish_flutter }}
    steps:
      - id: release
        name: Resolve immutable release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG_NAME: ${{ github.ref_name }}
          INPUT_REF: ${{ inputs.release_ref }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PUBLISH_FLUTTER: ${{ inputs.publish_flutter }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "push" ]]; then
            version="${TAG_NAME#sdk-v}"
            release_ref="$TAG_NAME"
            publish_flutter="true"
          else
            version="$INPUT_VERSION"
            release_ref="$INPUT_REF"
            publish_flutter="$INPUT_PUBLISH_FLUTTER"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid semantic version: $version" >&2
            exit 1
          fi
          echo "release_ref=$release_ref" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish_flutter=$publish_flutter" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.release_ref }}
          fetch-depth: 0

      - name: Validate every package version and identity
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("fs");
          const expected = process.env.VERSION;
          const rn = JSON.parse(fs.readFileSync("packages/react-native/package.json", "utf8"));
          if (rn.name !== "@onlo-ai/react-native" || rn.version !== expected) {
            throw new Error(`React Native identity mismatch: ${rn.name}@${rn.version}`);
          }
          const flutter = fs.readFileSync("packages/flutter/pubspec.yaml", "utf8");
          if (!new RegExp(`^version: ${expected.replaceAll(".", "\\.")}$`, "m").test(flutter)) {
            throw new Error(`Flutter version does not match ${expected}`);
          }
          const podspec = fs.readFileSync("OnloSDK.podspec", "utf8");
          if (!new RegExp(`s\\.version\\s*=\\s*['"]${expected.replaceAll(".", "\\.")}['"]`).test(podspec)) {
            throw new Error(`CocoaPods version does not match ${expected}`);
          }
          const android = fs.readFileSync("packages/android/build.gradle.kts", "utf8");
          if (!android.includes(`getOrElse("${expected}")`)) {
            throw new Error(`Android version does not match ${expected}`);
          }
          NODE
          git ls-remote --exit-code origin "refs/tags/$VERSION"

  publish-ios:
    needs: preflight
    runs-on: macos-15
    environment: sdk-release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.release_ref }}

      - id: existing
        name: Check CocoaPods version
        shell: bash
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          if pod trunk info OnloSDK 2>/dev/null | grep -Eq "^[[:space:]]+- ${VERSION} \\("; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish OnloSDK to CocoaPods
        if: steps.existing.outputs.published != 'true'
        env:
          COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}
        run: pod trunk push OnloSDK.podspec --allow-warnings

  publish-android:
    needs: preflight
    runs-on: ubuntu-latest
    environment: sdk-release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.release_ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - id: existing
        name: Check Maven Central version
        shell: bash
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          url="https://repo1.maven.org/maven2/ai/onlo/onlo-android-sdk/${VERSION}/onlo-android-sdk-${VERSION}.pom"
          if curl --fail --silent --show-error --location "$url" >/dev/null; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish Android SDK to Maven Central
        if: steps.existing.outputs.published != 'true'
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.MAVEN_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MAVEN_SIGNING_PASSWORD }}
        run: |
          packages/android/gradlew -p packages/android \
            publishAndReleaseToMavenCentral \
            -Ponlo.maven.central=true \
            -Ponlo.release.version=${{ needs.preflight.outputs.version }}

  verify-native:
    needs: [preflight, publish-ios, publish-android]
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - name: Verify public SwiftPM tag
        shell: bash
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          git ls-remote --exit-code \
            https://github.com/onlo-ai/onlo-mobile-sdks.git \
            "refs/tags/$VERSION"

      - name: Verify public CocoaPods version
        shell: bash
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          for attempt in {1..20}; do
            if pod trunk info OnloSDK 2>/dev/null | grep -Eq "^[[:space:]]+- ${VERSION} \\("; then
              exit 0
            fi
            sleep 15
          done
          echo "OnloSDK $VERSION is not publicly resolvable" >&2
          exit 1

      - name: Verify public Maven version
        shell: bash
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          url="https://repo1.maven.org/maven2/ai/onlo/onlo-android-sdk/${VERSION}/onlo-android-sdk-${VERSION}.pom"
          for attempt in {1..120}; do
            if curl --fail --silent --show-error --location "$url" >/dev/null; then
              exit 0
            fi
            sleep 15
          done
          echo "Android SDK $VERSION is not publicly resolvable" >&2
          exit 1

  publish-react-native:
    needs: [preflight, verify-native]
    runs-on: ubuntu-latest
    environment: sdk-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.release_ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
          cache: npm

      - id: existing
        name: Check npm version
        shell: bash
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          if npm view "@onlo-ai/react-native@$VERSION" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish React Native package
        if: steps.existing.outputs.published != 'true'
        working-directory: packages/react-native
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance

  publish-flutter:
    needs: [preflight, verify-native]
    if: needs.preflight.outputs.publish_flutter == 'true'
    runs-on: ubuntu-latest
    environment: sdk-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.release_ref }}

      - uses: dart-lang/setup-dart@v1

      - id: existing
        name: Check pub.dev version
        shell: bash
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          if curl --fail --silent --show-error --location \
            "https://pub.dev/api/packages/onlo_flutter" |
            grep -Fq "\"version\":\"$VERSION\""; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish Flutter package
        if: steps.existing.outputs.published != 'true'
        working-directory: packages/flutter
        run: dart pub publish --force

  verify-wrappers:
    needs: [preflight, publish-react-native, publish-flutter]
    if: always() && needs.publish-react-native.result == 'success' && (needs.publish-flutter.result == 'success' || needs.publish-flutter.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Verify public npm version
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: npm view "@onlo-ai/react-native@$VERSION" version

      - name: Verify public pub.dev version when requested
        if: needs.preflight.outputs.publish_flutter == 'true'
        shell: bash
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            "https://pub.dev/api/packages/onlo_flutter" |
            grep -Fq "\"version\":\"$VERSION\""

  github-release:
    needs: [preflight, verify-wrappers]
    if: github.event_name == 'push' && needs.verify-wrappers.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.preflight.outputs.release_ref }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Onlo Mobile SDKs $VERSION" \
              --generate-notes
