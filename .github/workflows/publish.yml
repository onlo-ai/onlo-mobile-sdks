name: Publish mobile SDKs

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

concurrency:
  group: mobile-sdk-publication
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
    outputs:
      manifest_sha: ${{ steps.manifest.outputs.sha }}
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require protected main ancestry and exact-SHA CI
        run: python3 scripts/release_control.py authority "$VERSION"
      - name: Verify every SDK version
        run: npm run check:versions -- --expected "$VERSION"
      - id: existing
        name: Reuse an immutable prepared draft on rerun
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          exists="$(python3 -c 'import json,os; print(str(any(r["tag_name"] == os.environ["VERSION"] for r in json.load(open(os.environ["RUNNER_TEMP"] + "/releases.json")))).lower())')"
          echo "exists=$exists" >> "$GITHUB_OUTPUT"
          if [[ "$exists" == true ]]; then
            python3 scripts/release_control.py restore "$VERSION" --directory "$RUNNER_TEMP/restored"
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: steps.existing.outputs.exists != 'true'
        with:
          node-version: '22'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        if: steps.existing.outputs.exists != 'true'
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        if: steps.existing.outputs.exists != 'true'
        with:
          packages: platform-tools
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        if: steps.existing.outputs.exists != 'true'
        with:
          flutter-version: '3.44.2'
      - name: Prepare publishable bytes once
        if: steps.existing.outputs.exists != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/prepared/maven"
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          packages/android/gradlew -p packages/android publishReleasePublicationToQualificationRepository -Ponlo.maven.repository="$RUNNER_TEMP/maven"
          export PREPARED="$RUNNER_TEMP/prepared"
          python3 - <<'PYTHON'
          import os, pathlib, shutil
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          for p in (root / 'maven/ai/onlo/onlo-android-sdk' / os.environ['VERSION']).iterdir():
              if p.suffix in ('.aar', '.jar', '.pom', '.module'):
                  shutil.copy2(p, root / 'prepared/maven' / p.name)
          PYTHON
          npm pack ./packages/react-native --json --pack-destination "$RUNNER_TEMP" > "$RUNNER_TEMP/npm-pack.json"
          python3 - <<'PYTHON'
          import json, os, pathlib, shutil
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          metadata = json.loads((root / 'npm-pack.json').read_text())
          shutil.move(root / metadata[0]['filename'], root / 'prepared/react-native.tgz')
          PYTHON
          (cd packages/flutter && dart pub publish --dry-run --to-archive="$RUNNER_TEMP/prepared/flutter.tar.gz")
          pod ipc spec OnloSDK.podspec > "$RUNNER_TEMP/prepared/OnloSDK.podspec.json"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/prepared/ios-source.tar.gz"
          python3 scripts/release_artifacts.py create "$RUNNER_TEMP/prepared" --version "$VERSION" --commit "$(git rev-parse HEAD)"
          python3 scripts/release_control.py draft "$VERSION" --directory "$RUNNER_TEMP/prepared"
      - id: manifest
        name: Bind approval to the prepared manifest
        env:
          EXISTING: ${{ steps.existing.outputs.exists }}
        run: |
          python3 - <<'PYTHON'
          import hashlib, os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          manifest = root / ('restored/manifest.json' if os.environ['EXISTING'] == 'true' else 'prepared/manifest.json')
          digest = hashlib.sha256(manifest.read_bytes()).hexdigest()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output: output.write('sha=' + digest + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output: output.write('DRAFT prepared. Approval manifest SHA-256: `' + digest + '`\n')
          PYTHON

  publish:
    needs: prepare
    runs-on: macos-15
    timeout-minutes: 120
    environment: sdk-release
    permissions:
      contents: write
      actions: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ github.ref_name }}
      MANIFEST_SHA: ${{ needs.prepare.outputs.manifest_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Revalidate authority and download approved bytes
        run: python3 scripts/release_control.py restore "$VERSION" --directory "$RUNNER_TEMP/approved"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.44.2'
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d
        with:
          sdk: '3.12.2'
      - name: Install signing tool
        run: command -v gpg >/dev/null || brew install gnupg
      - name: Publish missing packages and verify actual registry bytes
        env:
          NPM_E404_RESOLVED: ${{ vars.NPM_E404_RESOLVED }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_SIGNING_KEY: ${{ secrets.MAVEN_SIGNING_KEY }}
          MAVEN_SIGNING_PASSWORD: ${{ secrets.MAVEN_SIGNING_PASSWORD }}
        run: python3 scripts/release_publish.py "$VERSION" "$RUNNER_TEMP/approved/prepared" --manifest-sha "$MANIFEST_SHA"
      - name: Finalize only after four independent registry verifications
        run: python3 scripts/release_control.py finalize "$VERSION" --directory "$RUNNER_TEMP/approved/prepared" --manifest-sha "$MANIFEST_SHA"
