buildscript {
  repositories {
    google()
    mavenCentral()
    gradlePluginPortal()
  }
  dependencies {
    classpath 'com.android.tools.build:gradle:8.6.1'
    classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.0.21'
  }
}

apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'com.facebook.react'

react {
  jsRootDir = file('../src')
  libraryName = 'OnloSDKSpec'
  codegenJavaPackageName = 'ai.onlo.reactnative'
}

android {
  namespace 'ai.onlo.reactnative'
  compileSdk 35
  buildToolsVersion '35.0.0'

  defaultConfig {
    minSdk 24
    consumerProguardFiles 'consumer-rules.pro'
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = '17'
  }
}

dependencies {
  implementation 'com.facebook.react:react-android'
  implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'

  def localCore = rootProject.findProject(':onlo-android-sdk')
  if (localCore == null) {
    throw new GradleException('The unpublished Onlo Android core must be included as :onlo-android-sdk.')
  }
  implementation localCore
}
