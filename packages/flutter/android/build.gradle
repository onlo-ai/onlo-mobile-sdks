def packageVersionMatch = file('../pubspec.yaml').getText('UTF-8') =~ /(?m)^version:\s*([0-9]+\.[0-9]+\.[0-9]+)\s*$/
if (!packageVersionMatch.find()) {
    throw new GradleException('pubspec.yaml version must be semantic')
}
def packageVersion = packageVersionMatch.group(1)

group 'ai.onlo.flutter'
version packageVersion

buildscript {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.6.1'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.0.21'
    }
}

apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace 'ai.onlo.flutter'
    compileSdk 35
    buildToolsVersion '35.0.0'

    defaultConfig {
        minSdk 24
        consumerProguardFiles 'consumer-rules.pro'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    def localCore = rootProject.findProject(':onlo-android-sdk')
    if (localCore != null) {
        implementation localCore
    } else {
        def coreGroup = providers.gradleProperty('onlo.android.group').getOrElse('ai.onlo')
        def coreArtifact = providers.gradleProperty('onlo.android.artifact').getOrElse('onlo-android-sdk')
        def coreVersion = providers.gradleProperty('onlo.android.version').getOrElse(packageVersion)
        if (coreVersion != packageVersion) {
            throw new GradleException('onlo.android.version must match pubspec.yaml')
        }
        implementation "${coreGroup}:${coreArtifact}:${coreVersion}"
    }
}
